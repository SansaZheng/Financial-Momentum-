name: source-smoke

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy
      - name: Verify vendored source provenance
        run: python scripts/run_source_smoke.py
      - name: Check asset manifest
        run: python scripts/check_asset_manifest.py
      - name: Run causal and cost contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
